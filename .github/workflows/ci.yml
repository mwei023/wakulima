name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Phase 2.2: sync API tests run against a real Postgres (ADR-002).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wakulima
          POSTGRES_USER: wakulima
          POSTGRES_PASSWORD: wakulima
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wakulima"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://wakulima:wakulima@127.0.0.1:5432/wakulima
      PGUSER: wakulima
      PGPASSWORD: wakulima

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS: jsdom 30's bundled undici requires
          # util.markAsUncloneable, which Node 20 lacks.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (errors fail the build)
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test
